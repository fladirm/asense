name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Ubuntu 26.04 release
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libelf-dev linux-headers-generic \
            desktop-file-utils systemd zip

      - name: Record runner system Rust authority
        run: |
          command -v rustc
          rustc -Vv
          command -v cargo
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(scripts/version.sh show)"
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Verify release candidate
        run: scripts/verify-release.sh

      - name: Build release assets
        env:
          ASENSE_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/package-release.sh

      - name: Upload release-candidate assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asense-v${{ steps.version.outputs.version }}-rc-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            asense-v${{ steps.version.outputs.version }}-*.zip
            asense-v${{ steps.version.outputs.version }}-*.zip.sha256
            SHA256SUMS

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ASENSE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_flags=()
          if [[ "$ASENSE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "ASense v${ASENSE_VERSION}" \
            --notes-file "docs/RELEASE_NOTES_v${ASENSE_VERSION}.md" \
            asense-v"${ASENSE_VERSION}"-*.zip \
            asense-v"${ASENSE_VERSION}"-*.zip.sha256 \
            SHA256SUMS
