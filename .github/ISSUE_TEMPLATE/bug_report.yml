name: Bug report
description: Report a reproducible ASense problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include serial numbers,
        UUIDs, hostnames, network addresses or private logs. For hardware
        behavior, capture `asense probe > asense-probe.json` and
        `asense probe --summary` consecutively without changing machine state.

  - type: input
    id: version
    attributes:
      label: ASense version
      placeholder: v0.3.0 package or exact commit
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Exact Acer model
      placeholder: Predator PHN16-72
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Distribution and desktop
      placeholder: Ubuntu 26.04, GNOME
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      placeholder: Output of uname -r
    validations:
      required: true

  - type: input
    id: bios
    attributes:
      label: BIOS version
      placeholder: "1.18"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: captured_state
    attributes:
      label: Synchronized machine state
      description: >-
        State AC or battery, requested profile/fan/lighting mode, suspend state
        and any live plug/unplug when the failure and probe were captured.
      placeholder: AC online; Performance; fans Auto; resumed once; no plug change.
    validations:
      required: true

  - type: textarea
    id: probe_summary
    attributes:
      label: Schema-3 probe summary
      description: Paste the complete output of asense probe --summary.
      render: text
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: Schema-3 asense-probe.json
      description: >-
        Review and attach the JSON generated immediately beside the summary.
        If the command itself fails, paste its exact error instead.
      placeholder: Attach asense-probe.json or paste the exact probe error.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I reviewed the report and removed any information I do not want to share.
          required: true
        - label: The observed behavior and probe use the same installed ASense build.
          required: true
        - label: I did not reboot or reload relevant kernel modules between the failure and capture.
          required: true
